services:
  - type: web
    name: nexus-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NEXUS_AUTH_REQUIRED
        value: "true"
      - key: NEXUS_CORS_ORIGINS
        sync: false
      - key: NEXUS_DISPATCHER_TOKEN
        generateValue: true
